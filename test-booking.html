<!DOCTYPE html>
<html>
<head>
    <title>Test Réservation</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a1a; color: #fff; }
        .form-group { margin: 10px 0; }
        input, button { padding: 10px; margin: 5px; background: #333; color: #fff; border: 1px solid #555; }
        button { background: #d4af37; color: #000; cursor: pointer; }
        .result { margin: 20px 0; padding: 15px; border: 1px solid #555; background: #2a2a2a; }
        .error { border-color: #ff4444; background: #330000; }
        .success { border-color: #44ff44; background: #003300; }
    </style>
</head>
<body>
    <h1>🧪 Test de Réservation Direct</h1>
    
    <div class="form-group">
        <label>Teacher ID:</label>
        <input type="number" id="teacherId" value="1" />
    </div>
    
    <div class="form-group">
        <label>Course ID:</label>
        <input type="number" id="courseId" value="1" />
    </div>
    
    <div class="form-group">
        <label>Student ID:</label>
        <input type="number" id="studentId" value="1" />
    </div>
    
    <div class="form-group">
        <label>Date (YYYY-MM-DD):</label>
        <input type="date" id="date" />
    </div>
    
    <div class="form-group">
        <label>Heure début (HH:MM):</label>
        <input type="time" id="startTime" value="14:00" />
    </div>
    
    <div class="form-group">
        <label>Heure fin (HH:MM):</label>
        <input type="time" id="endTime" value="15:00" />
    </div>
    
    <button onclick="testBooking()">🚀 Tester la Réservation</button>
    <button onclick="clearResult()">🧹 Effacer</button>
    
    <div id="result" class="result" style="display: none;"></div>

    <script>
        // Définir la date par défaut à demain
        document.getElementById('date').value = new Date(Date.now() + 24*60*60*1000).toISOString().split('T')[0];

        async function testBooking() {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result';
            resultDiv.innerHTML = '⏳ Test en cours...';
            
            try {
                const teacherId = document.getElementById('teacherId').value;
                const courseId = document.getElementById('courseId').value;
                const studentId = document.getElementById('studentId').value;
                const date = document.getElementById('date').value;
                const startTime = document.getElementById('startTime').value;
                const endTime = document.getElementById('endTime').value;
                
                // Construction des dates ISO
                const startDateTime = `${date}T${startTime}:00+00:00`;
                const endDateTime = `${date}T${endTime}:00+00:00`;
                
                const requestData = {
                    teacher_id: parseInt(teacherId),
                    course_id: parseInt(courseId),
                    student_id: parseInt(studentId),
                    start_time: startDateTime,
                    end_time: endDateTime
                };
                
                console.log('📤 Données envoyées:', requestData);
                
                const response = await fetch('/api/bookings/reserve', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestData)
                });
                
                const responseText = await response.text();
                let responseData;
                try {
                    responseData = JSON.parse(responseText);
                } catch {
                    responseData = { raw: responseText };
                }
                
                console.log('📥 Réponse reçue:', responseData);
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>✅ Réservation Réussie!</h3>
                        <p><strong>Status:</strong> ${response.status}</p>
                        <p><strong>Booking ID:</strong> ${responseData.booking_id || 'N/A'}</p>
                        <p><strong>Référence:</strong> ${responseData.booking_reference || 'N/A'}</p>
                        <pre>${JSON.stringify(responseData, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <h3>❌ Erreur ${response.status}</h3>
                        <p><strong>Message:</strong> ${responseData.error || responseData.message || 'Erreur inconnue'}</p>
                        <p><strong>Détails:</strong></p>
                        <pre>${JSON.stringify(responseData, null, 2)}</pre>
                        <p><strong>Données envoyées:</strong></p>
                        <pre>${JSON.stringify(requestData, null, 2)}</pre>
                    `;
                }
                
            } catch (error) {
                console.error('💥 Erreur:', error);
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <h3>💥 Erreur de Connexion</h3>
                    <p>${error.message}</p>
                `;
            }
        }
        
        function clearResult() {
            document.getElementById('result').style.display = 'none';
        }
    </script>
</body>
</html>
